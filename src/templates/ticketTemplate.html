<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bharat Bhakti Sangam Ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Roboto", sans-serif;
      }

      html {
        background: transparent !important;
      }

      body {
        background: transparent !important;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        /* align-items: center; */
        min-height: 100vh;
      }
      .container {
        background-color: #000;
        height: 835px;
        width: 412px;
        padding: 30px 15px;
        position: relative;
      }
      .ticket {
        width: 380px;
        height: 775px;
        background:
          /* radial-gradient(
            circle at 50% 20%,
            rgba(255, 140, 0, 0.15),
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(255, 255, 255, 0.05),
            transparent 50%
          ), */ linear-gradient(
          180deg,
          #1a1a1a 0%,
          #1a1a1a 40%,
          #2c2c2c 100%
        );

        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        border: 1px solid #535353;
        border-radius: 25px;
        position: relative;
        padding: 40px 30px;
        /* z-index: 0; */
      }

      .header {
        /* background-color: orange; */
        text-align: center;
        /* padding: 25px 0px 15px 0px; */
      }

      .logo-placeholder {
        /* background-color: red; */
        width: 100%;
        height: 80px;
        /* padding: 5px; */
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        /* border-bottom: 1px solid red; */
      }
      .logo-div {
        /* background-color: green; */
        width: 35%;
      }
      .hr-div {
        width: 100%;
        margin-bottom: 25px;
      }
      hr {
        width: 100%;
        border: none;
        height: 1px;
        background: linear-gradient(
          to right,
          #191919 0%,
          #4a4a4a 50%,
          #191919 100%
        );
      }
      .event-subtitle {
        color: #ffcc00;
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .event-title {
        color: #ff6600;
        font-size: 18px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .event-info {
        margin-top: 25px;
        display: flex;
        gap: 17px;
      }

      .event-poster {
        width: 80px;
        height: 104px;
        border-radius: 8px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .event-poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .event-details {
        flex: 1;
        color: #fff;
      }

      .event-name {
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 5%;
        margin-bottom: 8px;
      }

      .event-location {
        font-size: 14px;
        color: #ccc;
        letter-spacing: 5%;
        margin-top: 6px;
        margin-bottom: 6px;
      }

      .event-date {
        font-size: 14px;
        letter-spacing: 2%;
        color: #ddd;
        margin-bottom: 8px;
      }

      .event-venue {
        font-size: 14px;
        color: #fff;
        display: flex;
        align-items: center;
        align-items: flex-start;
        gap: 5px;
        margin-top: 10px;
      }

      .location-icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .qr-section {
        margin-top: 42px;
        /* padding: 25px 20px; */
        text-align: center;
        position: relative;
      }

      .qr-code {
        background: white;
        padding: 15px;
        display: inline-block;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      }

      .qr-code img {
        width: 147px;
        height: 147px;
      }

      .booking-id {
        position: absolute;
        right: -16px;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        color: #fff;
        font-size: 14px;
        letter-spacing: 5%;
        transform: rotate(180deg);
        text-transform: uppercase;
        top: 0;
        height: 100%;
      }

      .visitors {
        margin-top: 18px;
        letter-spacing: 2%;
        text-align: center;
        font-weight: 500;
        color: #fff;
        font-size: 14px;
      }

      .perforation_main {
        position: relative;
        text-align: center;
        height: 20px;
      }

      .perforation {
        height: 1px;
        background: repeating-linear-gradient(
          90deg,
          #828282,
          #828282 10px,
          transparent 10px,
          transparent 20px
        );
        margin-top: 25px;
      }

      .circel_1 {
        width: 40px;
        height: 50px;
        background-color: #000;
        position: absolute;
        top: 69%;
        left: 0px;
        transform: translateY(-50%);
        border-radius: 50%;
        border-right: 1px solid #5f5f5f;
      }

      .circel_2 {
        width: 40px;
        height: 50px;
        background-color: #000;
        position: absolute;
        top: 69%;
        right: 5px;
        transform: translateY(-50%);
        border-radius: 50%;
        border-left: 1px solid #5f5f5f;
      }

      .bottom-section {
        width: 100%;
        margin-top: 30px;
        /* padding: 10px; */
        /* background-color: orange; */
        display: flex;
        gap: 15px;
        justify-content: center;
      }

      /* .band-poster {
        width: 80px;
        height: 80px;
        border-radius: 8px;
        overflow: hidden;
        flex-shrink: 0;
      } */
      .band-poster {
        /* background-color: red; */
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
        align-items: center;
      }

      .band-poster img {
        width: 86px;
        height: 75px;
        object-fit: cover;
        border-radius: 8px;
      }

      .band-poster-details {
        /* background-color: yellowgreen; */
        /* width: 30%; */
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
      }
      .band-poster-details small {
        font-size: 12px;
        color: #fff;
        margin-top: 12px;
      }
      .band-details {
        flex: 1;
        color: #fff;
      }
      .band-name {
        font-size: 14px;
        letter-spacing: 5%;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .hashtag {
        position: absolute;
        bottom: 0;
        right: 0;
        color: #666;
        font-size: 13px;
        padding: 39px 20px 15px;
      }
      .circel_3 {
        width: 50px; /* Diameter */
        height: 40px; /* Half of diameter */
        background-color: #000; /* Fill color */
        position: absolute;
        top: 96%;
        left: 43%;
        transform: translateY(-50%);
        border-radius: 50px 50px 0 0; /* Creates top curve */
        border-top: 1px solid #5f5f5f;
        z-index: 100;
      }
    </style>
  </head>

</html>
